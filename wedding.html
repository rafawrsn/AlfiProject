<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/Logo 3 White.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/Logo 3 White.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Playfair Display', serif;
      margin: 0;
    }

    section {
      padding: 60px 20px;
      text-align: center;
    }

    .hero {
      background: url('assets/images/price-list/Wedding\ 1.png') center/cover no-repeat;
      height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    
    .hero h1 {
      font-size: 48px;
      margin-bottom: 10px;
      font-weight: lighter;
    }

    .hero p {
      font-size: 18px;
    }


    .content img,
.price img {
  display: block;
  margin: 0 auto;
}

    .content img {
      max-width: 300px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .price img {
      max-width: 500px;
    }

  @media (max-width: 768px){

  section{
    padding: 0; /* hilangkan semua gap mobile */
  }

  .price{
    padding: 0;
    margin: 0;
  }

  .price img{
    display: block;
    width: 100%;
    max-width: 100%;
    margin: 0;
    border-radius: 0; /* kalau mau nempel tanpa sudut rounded */
  }

}

  </style>
</head>

          <span class="bar"></span>

        <ul class="nav-menu">
          <li><a href="#gallery" class="nav-link">Gallery</a></li>
          <li><a href="#catalog" class="nav-link">Services</a></li>
          <li><a href="#contact" class="nav-link">Contact</a></li>
        </ul>
      </div>
    </nav>
</header>

<!-- HERO -->
<section id="profile" class="hero">
  <div class="hero-content">

  </div>

  <div class="service-card image-card fade-in">
<section id="gallery" class="price">

</div>

<!-- PRICE LIST -->

<section id="catalog" class="price">

 <footer class="footer">

   <div class="footer-social">

      </a>
      <a href="https://wa.me/6287720297620?text=Halo,%20saya%20ingin%20bertanya%20tentang%20jasa%20anda%20!" target="_blank">
